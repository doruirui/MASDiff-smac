# SUMO 环境接入示例（道路累计过车数版本，一套模块一个 yaml）
# 说明：
# - 复用 MASDiff 主流程与 sumo_ryl 的 Q / metric / environment 组件
# - 仅把环境替换为“道路累计过车数”版本
# - 使用 testsumo.net.xml / testsumo.rou.xml / testsumo.sumocfg
# - 进化阶段由 EvoX 接管（默认示例为 OpenES）

seed: 42

algorithm:
  M: 200
  N: 2336
  K: 1

logging:
  best_rho_csv_path: "outputs/sumo_ryl_only_astar_nov_best_rho_history.csv"
  initial_population_path: "outputs/sumo_ryl_only_astar_nov_initial_population.pkl"

q_provider:
  class_path: "src.q.sumo_ryl_nov_q:SumoRylQProvider"
  kwargs:
    # testsumo.rou.xml 中 vehicle 数量 = 2336
    num_car: 2336
    cache_path: "outputs/Q_nov.pickle"
    force_recompute: false

environment:
  class_path: "src.environments.sumo_ryl_nov:SumoRylNovEnvironment"
  kwargs:
    # --- SUMO 基础配置 ---
    sumo_config: "maps/testsumo.sumocfg"
    net_file: "maps/testsumo.net.xml"
    route_file: "maps/testsumo.rou.xml"
    sumo_use_gui: false
    # sumo_binary: "sumo"

    # --- 仿真控制 ---
    # testsumo.rou.xml 中注释区间为 begin=0, end=600
    end_tick: 600
    update_interval: 600
    sample_interval: 600

    # 模型平时放 CPU；推理时按 policy_device 临时迁移
    move_policies_to_device: false
    policy_device: "cpu"

    # R + 纯Astar 路径规划的奖励影响权重
    reward_astar_weight: 10.0

    # --- 额外 SUMO 参数（可选）---
    extra_sumo_args:
      # - "--seed"
      # - "0"

evox:
  algorithm:
    class_path: "evox.algorithms:OpenES"
    kwargs:
      pop_size: 64
      learning_rate: 0.05
      noise_stdev: 0.15
      optimizer: "adam"
      mirrored_sampling: true
      device: "cuda"
  reward_min: 0.0
  reward_max: 5.0
  repo_path: "/mnt/d/evox"
  init_strategy: "best"
  device: "cuda"

metric:
  class_path: "src.metrics.sumo_ryl_metric:SumoRylMetric"
  kwargs:
    transform: "inv1p"
    eps: 1.0e-8

parallel_executor:
  class_path: "src.parallel.ray_executor:RayExecutor"
  kwargs:
    ray_init_kwargs:
      include_dashboard: false
      _temp_dir: "/tmp/r"
      num_cpus: 32
      num_gpus: 3
      object_store_memory: 536870912

    task_options_by_name:
      build_initial_individual:
        num_cpus: 3
        num_gpus: 0.25
      evaluate_reward_candidate:
        num_cpus: 3
        num_gpus: 0.25

    default_task_options:
      num_cpus: 1

    show_progress: true
    desc: "RayExecutor"
    max_updates: 20
    max_inflight_tasks: 4
    ray_startup_retries: 6
    ray_startup_retry_delay_s: 5.0
    raylet_start_wait_time_s: 300

extra:
  note: "sumo_ryl_only_astar_nov 配置示例（道路累计过车数版本，EvoX + OpenES）"
